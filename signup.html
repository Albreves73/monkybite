<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MonkyBite — Create Account</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="styles.css">

<style>
body {
    background: #f5f6fa;
    font-family: Arial, sans-serif;
}
.container {
    width: 100%;
    max-width: 420px;
    margin: 60px auto;
    background: #fff;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0,0,0,0.08);
}
h2 {
    text-align: center;
    margin-bottom: 25px;
}
input, select {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
}
button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    background: #4CAF50;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}
button:hover {
    background: #43a047;
}
#error {
    color: red;
    margin-top: 10px;
    text-align: center;
}
</style>

</head>
<body>

<div class="container">
    <h2>Create your MonkyBite account</h2>

    <form id="signupForm" method="POST" action="signup.php">

        <input type="text" name="name" placeholder="Full Name" required>

        <input type="email" name="email" id="email" placeholder="Email" required>

        <input type="password" name="password" placeholder="Password" required>

        <select name="plan">
            <option value="free">Free — 5GB</option>
            <option value="starter">Starter — 1TB</option>
            <option value="pro">Pro — 2TB</option>
            <option value="enterprise">Enterprise — 5TB</option>
        </select>

        <button type="submit">Continue</button>

        <div id="error"></div>
    </form>
</div>

<script>
// ===============================
// CHECK IF EMAIL EXISTS
// ===============================
document.getElementById("email").addEventListener("blur", function() {
    let email = this.value;

    if (!email.includes("@")) return;

    fetch("check-email.php?email=" + encodeURIComponent(email))
        .then(r => r.text())
        .then(t => {
            if (t === "exists") {
                document.getElementById("error").innerText = "Email already exists.";
            } else {
                document.getElementById("error").innerText = "";
            }
        });
});
</script>

</body>
</html>
