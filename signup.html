
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — MonkyBite</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .login-container {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      margin: 60px auto;
    }

    .login-container h2 {
      margin-bottom: 20px;
      text-align: center;
      color: #1a2a4f;
    }

    .login-container button,
    .login-container input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    .social-login {
      background-color: #4285F4;
      color: white;
      border: none;
    }

    .apple-login {
      background-color: black;
      color: white;
      border: none;
    }

    .email-login {
      background-color: #1a73e8;
      color: white;
      border: none;
    }

    .email-login:hover {
      background-color: #0049c6;
    }

    .signup-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.95rem;
    }

    .signup-link a {
      color: #1a73e8;
      text-decoration: underline;
    }
  </style>
</head>
<body>


  <!-- ✅ Navegação padronizada -->
  <!-- 🔷 Header com menu responsivo -->
<header>
  <a href="index.html" class="logo">
    <img src="logo.png" alt="MonkyBite Logo" />
    <span class="brand-name">MonkyBite</span>
  </a>

  <div class="nav-wrapper">
    <!-- Desktop menu -->
    <nav class="nav-desktop">
      <a href="index.html">HOME</a>
      <a href="login.html">LOGIN</a>
      <a href="plans.html">SIGN UP</a>
      <a href="contact.html">CONTACT</a>
    </nav>

    <!-- Mobile menu -->
    <button class="hamburger" id="hamburger-btn">☰</button>
    <nav class="nav-mobile hidden" id="mobile-nav">
      <a href="index.html">HOME</a>
      <a href="login.html">LOGIN</a>
      <a href="plans.html">SIGN UP</a>
      <a href="contact.html">CONTACT</a>
    </nav>
  </div>
</header>

<div class="go-back-wrapper">
  <a href="javascript:history.back()" class="go-back">Go Back</a>
</div>


  <!-- ✅ Conteúdo principal -->
  <div class="login-container">

  <h2>Create Your MonkyBite Account</h2>

  <button class="social-login">
    Continue with Google
  </button>

  <button class="apple-login">
    Continue with Apple
  </button>

  <hr />

  <form action="checkout.php" method="GET">

    <input type="hidden" name="plan" id="plan">

    <input
      type="text"
      name="first_name"
      placeholder="First Name"
      required>

    <input
      type="text"
      name="last_name"
      placeholder="Last Name"
      required>

    <input
      type="email"
      name="email"
      placeholder="Email"
      required>

    <input
      type="password"
      name="password"
      placeholder="Create Password"
      required>

    <input
      type="password"
      name="confirm_password"
      placeholder="Confirm Password"
      required>

    <label style="display:block; margin:15px 0;">
      <input type="checkbox" required>
      I agree to the Terms and Privacy Policy
    </label>

    <button class="email-login" type="submit">
      Sign Up
    </button>

  </form>

  <div class="signup-link">
    Already have an account?
    <a href="login.html">Login</a>
  </div>

</div>

  <!-- ✅ Rodapé -->
  <footer>
    <p>© 2025 MonkyBite</p>
  </footer>

  <!-- 🔷 Script no final da página -->
<script>
  const hamburgerBtn = document.getElementById("hamburger-btn");
  const mobileNav = document.getElementById("mobile-nav");

  hamburgerBtn.addEventListener("click", () => {
    mobileNav.classList.toggle("hidden");
  });
</script>
<script>
const params = new URLSearchParams(window.location.search);
const plan = params.get("plan");

if (plan) {
  document.getElementById("plan").value = plan;
}
</script>

</body>
</html>
