<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — MonkyBite</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    .signup-container {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      margin: 60px auto;
    }

    .signup-container h2 {
      margin-bottom: 20px;
      text-align: center;
      color: #1a2a4f;
    }

    .signup-container button,
    .signup-container input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    .social-login {
      background-color: #4285F4;
      color: white;
      border: none;
    }

    .apple-login {
      background-color: black;
      color: white;
      border: none;
    }

    .email-signup {
      background-color: #1a73e8;
      color: white;
      border: none;
    }

    .email-signup:hover {
      background-color: #0049c6;
    }

    #error {
      color: red;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<!-- 🔷 Header -->
<header>
  <a href="index.html" class="logo">
    <img src="logo.png" alt="MonkyBite Logo" />
    <span class="brand-name">MonkyBite</span>
  </a>

  <div class="nav-wrapper">
    <nav class="nav-desktop">
      <a href="index.html">HOME</a>
      <a href="login.html">LOGIN</a>
      <a href="plans.html">SIGN UP</a>
      <a href="contact.html">CONTACT</a>
    </nav>

    <button class="hamburger" id="hamburger-btn">☰</button>
    <nav class="nav-mobile hidden" id="mobile-nav">
      <a href="index.html">HOME</a>
      <a href="login.html">LOGIN</a>
      <a href="plans.html">SIGN UP</a>
      <a href="contact.html">CONTACT</a>
    </nav>
  </div>
</header>

<div class="go-back-wrapper">
  <a href="javascript:history.back()" class="go-back">Go Back</a>
</div>

<!-- 🔷 Signup Form -->
<div class="signup-container">
  <h2>Create Your MonkyBite Account</h2>

  <!-- Social buttons (same as login) -->
  <button class="social-login">Continue with Google</button>
  <button class="apple-login">Continue with Apple</button>

  <hr />

  <form id="signupForm" method="POST" action="signup.php">

    <input type="text" name="name" placeholder="Full Name" required />

    <input type="email" name="email" id="email" placeholder="Email" required />

   <input type="password" name="password" placeholder="Password" required />

<!-- Agreement box BELOW the password field -->
<div class="agreement-box">
  By creating an account, you agree to our  
  <a href="terms.html">Terms of Service</a> and  
  <a href="privacy.html">Privacy Policy</a>.
</div>

<!-- Hidden plan (comes from plans.html) -->
<input type="hidden" name="plan" id="plan">

<button class="email-signup" type="submit">Create Account</button>


    <div id="error"></div>
  </form>
</div>

<!-- 🔷 Footer -->
<footer>
  <p>© 2025 MonkyBite</p>
</footer>

<script>
  // Mobile menu
  const hamburgerBtn = document.getElementById("hamburger-btn");
  const mobileNav = document.getElementById("mobile-nav");
  hamburgerBtn.addEventListener("click", () => {
    mobileNav.classList.toggle("hidden");
  });

  // Get plan from URL
  const params = new URLSearchParams(window.location.search);
  const plan = params.get("plan") || "free";
  document.getElementById("plan").value = plan;

  // Email check
  document.getElementById("email").addEventListener("blur", function () {
    let email = this.value;

    if (!email.includes("@")) return;

    fetch("check-email.php?email=" + encodeURIComponent(email))
      .then(r => r.text())
      .then(t => {
        if (t === "exists") {
          document.getElementById("error").innerText = "Email already exists.";
        } else {
          document.getElementById("error").innerText = "";
        }
      });
  });
</script>

</body>
</html>
