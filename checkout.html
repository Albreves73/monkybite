<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MonkyBite — Checkout</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script type="text/javascript" src="https://sandbox.web.squarecdn.com/v1/square.js"></script>

<style>
body {
    background: #f5f6fa;
    font-family: Arial, sans-serif;
}
.container {
    width: 100%;
    max-width: 420px;
    margin: 60px auto;
    background: #fff;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0,0,0,0.08);
}
h2 {
    text-align: center;
    margin-bottom: 25px;
}
#card-container {
    margin-top: 20px;
}
button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    background: #4CAF50;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}
button:hover {
    background: #43a047;
}
#error {
    color: red;
    margin-top: 10px;
    text-align: center;
}
</style>

</head>
<body>

<div class="container">
    <h2>Complete your payment</h2>

    <p id="planText"></p>

    <div id="card-container"></div>
    <button id="payButton">Pay Now</button>

    <div id="error"></div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const plan  = urlParams.get("plan");
const email = urlParams.get("email");
const name  = urlParams.get("name");
const passw = urlParams.get("password");

document.getElementById("planText").innerText = "Selected plan: " + plan.toUpperCase();

// ===============================
// Square Payment
// ===============================

async function startSquare() {
    const payments = Square.payments("sq0idp-JHruqkfGcQdQfmgDQYjnUQ", "LTZ1WY5B11Q9Q");

    const card = await payments.card();
    await card.attach("#card-container");

    document.getElementById("payButton").addEventListener("click", async () => {
        const result = await card.tokenize();

        if (result.status === "OK") {
            fetch("process-payment.php", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    token: result.token,
                    plan: plan,
                    email: email
                })
            })
            .then(r => r.json())
            .then(r => {
                if (r.success) {
                    window.location.href =
                        "payment-success.php?plan=" + encodeURIComponent(plan) +
                        "&email=" + encodeURIComponent(email) +
                        "&name=" + encodeURIComponent(name) +
                        "&password=" + encodeURIComponent(passw);
                } else {
                    document.getElementById("error").innerText = r.error;
                }
            });
        }
    });
}

startSquare();
</script>

</body>
</html>
