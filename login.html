<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MonkyBite — Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    margin: 0;
    background: #f5f6fa;
    font-family: Arial, sans-serif;
}

.topbar {
    background: #007bff;
    color: white;
    padding: 15px;
    display: flex;
    align-items: center;
}

.topbar img {
    height: 40px;
    margin-right: 10px;
}

.topbar button {
    margin-left: auto;
    background: white;
    color: #007bff;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.container {
    width: 100%;
    max-width: 420px;
    margin: 60px auto;
    background: #fff;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0,0,0,0.08);
}

h2 {
    text-align: center;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
}

button.login {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    background: #007bff;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button.login:hover {
    background: #0069d9;
}

.forgot {
    margin-top: 15px;
    text-align: center;
    color: #007bff;
    cursor: pointer;
}
</style>

</head>
<body>

<div class="topbar">
    <img src="logo.png" alt="MonkyBite">
    <span>MonkyBite</span>
    <button onclick="window.location.href='signup.html'">Back</button>
</div>

<div class="container">
    <h2>Login</h2>

    <form action="https://cloud.monkybite.com/login" method="POST">
        <input type="text" name="user" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>

        <button class="login" type="submit">Login</button>
    </form>

    <div class="forgot" onclick="window.location.href='reset-password.html'">
        Forgot Password?
    </div>
</div>

</body>
</html>
