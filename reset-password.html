<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MonkyBite — Reset Password</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    background: #f5f6fa;
    font-family: Arial, sans-serif;
}
.container {
    width: 100%;
    max-width: 420px;
    margin: 60px auto;
    background: #fff;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0,0,0,0.08);
}
h2 {
    text-align: center;
    margin-bottom: 25px;
}
input {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
}
button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    background: #4CAF50;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}
button:hover {
    background: #43a047;
}
#msg {
    margin-top: 15px;
    text-align: center;
}
</style>

</head>
<body>

<div class="container">
    <h2>Reset Password</h2>

    <input type="email" id="email" placeholder="Your email">

    <button onclick="resetPassword()">Send Reset Link</button>

    <div id="msg"></div>
</div>

<script>
function resetPassword() {
    let email = document.getElementById("email").value;

    fetch("reset-password.php?email=" + encodeURIComponent(email))
        .then(r => r.text())
        .then(t => {
            document.getElementById("msg").innerText = t;
        });
}
</script>

</body>
</html>
