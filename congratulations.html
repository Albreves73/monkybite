<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MonkyBite — Congratulations!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <a href="index.html" class="logo">
    <img src="logo.png" alt="MonkyBite Logo" />
    <span class="brand-name">MonkyBite</span>
  </a>

  <div class="nav-wrapper">
    <nav class="nav-desktop">
      <a href="index.html">HOME</a>
      <a href="login.html">LOGIN</a>
      <a href="plans.html">SIGN UP</a>
      <a href="contact.html">CONTACT</a>
    </nav>

    <button class="hamburger" id="hamburger-btn">☰</button>
    <nav class="nav-mobile hidden" id="mobile-nav">
      <a href="index.html">HOME</a>
      <a href="login.html">LOGIN</a>
      <a href="plans.html">SIGN UP</a>
      <a href="contact.html">CONTACT</a>
    </nav>
  </div>
</header>

<main class="checkout-wrapper">
  <h1 class="checkout-title">🎉 Congratulations!</h1>

  <p id="plan-message" class="plan-info">
    Your subscription is now active.
  </p>

  <div class="checkout-box" style="text-align:center;">
    <p>Welcome to MonkyBite! Your account is ready.</p>
    <p>You can now log in and start using your cloud storage.</p>

    <a href="https://cloud.monkybite.com" class="plan-button" style="margin-top:20px;">
      Go to Login
    </a>
  </div>
</main>

<footer>
  <p>© 2025 MonkyBite.</p>
</footer>

<script>
  const hamburgerBtn = document.getElementById("hamburger-btn");
  const mobileNav = document.getElementById("mobile-nav");

  hamburgerBtn.addEventListener("click", () => {
    mobileNav.classList.toggle("hidden");
  });
</script>

<script>
  // Recebe o plano pela URL
  const params = new URLSearchParams(window.location.search);
  const plan = params.get("plan");

  if (plan) {
    const formattedPlan = plan.charAt(0).toUpperCase() + plan.slice(1);
    document.getElementById("plan-message").textContent =
      `Your ${formattedPlan} plan is now active!`;
  }
</script>

</body>
</html>
