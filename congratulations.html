<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MonkyBite — Welcome!</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    background: #f5f6fa;
    font-family: Arial, sans-serif;
}
.container {
    width: 100%;
    max-width: 420px;
    margin: 60px auto;
    background: #fff;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0,0,0,0.08);
    text-align: center;
}
h2 {
    margin-bottom: 20px;
}
p {
    margin-top: 10px;
    font-size: 16px;
}
button {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    background: #4CAF50;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}
button:hover {
    background: #43a047;
}
</style>

</head>
<body>

<div class="container">
    <h2>Welcome to MonkyBite!</h2>

    <p>Your account has been created successfully.</p>

    <p id="planText"></p>

    <button onclick="window.location.href='login.html'">Go to Login</button>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const plan = params.get("plan");

document.getElementById("planText").innerText =
    "Your plan: " + plan.toUpperCase();
</script>

</body>
</html>
